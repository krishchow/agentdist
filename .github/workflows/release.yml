name: Release

# On every push to main: with pending changesets, open or update the "Version Packages" PR;
# without them (that PR was just merged), publish whatever version npm does not have yet.
# Follows https://changesets.dev/guide/automating#trusted-publishing: only the publish job can
# mint an npm OIDC token, and it publishes the tarball the pack job built and checked.

on:
  push:
    branches:
      - main

permissions: {}

# Queue rather than replace: with the default single pending slot, a later merge could cancel a
# pending publish run and version past a release that never reached npm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        env:
          # @changesets/changelog-github reads it to link each entry to its PR and author.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Lint, typecheck, build, the consumer type check and the tests: what prepublishOnly runs
      # for a manual publish, which publishing a packed tarball would skip.
      - run: pnpm run check
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Only the Changesets CLI is needed to publish the packed tarball, so no dependency install
      # script runs in the one job that can mint an npm token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
